version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agree_postgres
    environment:
      POSTGRES_USER: agree
      POSTGRES_PASSWORD: agree_password
      POSTGRES_DB: agree_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agree -d agree_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Sessions, Rate Limiting, Cache)
  redis:
    image: redis:7-alpine
    container_name: agree_redis
    command: redis-server --appendonly yes --requirepass agree_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "agree_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO (S3-compatible storage for development)
  minio:
    image: minio/minio:latest
    container_name: agree_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agree_minio
      MINIO_ROOT_PASSWORD: agree_minio_password
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: agree_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 agree_minio agree_minio_password;
      mc mb myminio/agree-documents --ignore-existing;
      mc mb myminio/agree-signatures --ignore-existing;
      mc mb myminio/agree-thumbnails --ignore-existing;
      mc anonymous set none myminio/agree-documents;
      mc anonymous set none myminio/agree-signatures;
      mc anonymous set none myminio/agree-thumbnails;
      echo 'Buckets created successfully';
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: agree_network
